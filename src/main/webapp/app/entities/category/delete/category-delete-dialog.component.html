@if (category) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(category.id!)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="categoryDeleteDialogHeading">Löschen bestätigen</h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error></jhi-alert-error>
      <p id="jhi-delete-category-heading">Soll Category {{ category.id }} wirklich dauerhaft gelöscht werden?</p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
        <fa-icon icon="ban"></fa-icon>&nbsp;<span>Abbrechen</span>
      </button>

      <button id="jhi-confirm-delete-category" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times"></fa-icon>&nbsp;<span>Löschen</span>
      </button>
    </div>
  </form>
}
